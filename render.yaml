# Render Blueprint: New > Blueprint > pick this repository.
# Creates the JuanMaApp web service with a persistent disk for the database.
services:
  - type: web
    name: juanmaapp
    runtime: docker
    rootDir: juanmaapp
    dockerfilePath: ./Dockerfile
    plan: starter            # a persistent disk needs a paid instance
    region: ohio
    healthCheckPath: /api/auth/status
    disk:
      name: juanmaapp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # asked for when the Blueprint is created
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: PROOF_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false          # e.g. https://juanmaapp.onrender.com (links in e-mails)
