<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Acuse de recibo · JuanMaApp</title>
  <link rel="icon" type="image/png" href="logo-t.png" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>.public-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; } .hash { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem; word-break: break-all; }</style>
</head>
<body>
  <header class="topbar"><div class="brand"><img class="logo" src="logo-t.png" alt="" width="44" height="44" /><div><h1>Acuse de recibo</h1><p class="tagline">JuanMaApp</p></div></div></header>
  <main class="public-wrap">
    <div id="msg" class="status" hidden></div>
    <section id="box" class="panel" hidden>
      <h2 id="subject"></h2>
      <p class="hint">Enviado el <span id="sent"></span> (UTC) a <span id="to"></span>.</p>
      <ul id="atts"></ul>
      <p class="hash">Huella del contenido (SHA-256): <span id="hash"></span></p>
      <form id="form">
        <label>Su nombre <input name="name" required /></label>
        <button class="primary">Confirmo que recibí este mensaje</button>
      </form>
    </section>
  </main>
  <script>
    const token = location.hash.slice(1), $ = (s) => document.querySelector(s);
    const show = (t, err) => { $("#msg").hidden = false; $("#msg").textContent = t; $("#msg").classList.toggle("error", !!err); };
    const api = async (method, path, body) => {
      const res = await fetch(`/api/public/mail/${encodeURIComponent(token)}${path}`, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `Error ${res.status}`);
      return d;
    };
    (async () => {
      try {
        const m = await api("GET", "");
        $("#box").hidden = false;
        $("#subject").textContent = m.subject; $("#sent").textContent = m.sent_at; $("#to").textContent = m.to; $("#hash").textContent = m.content_hash;
        $("#atts").innerHTML = m.attachments.map((a) => `<li>${a.filename.replace(/[<&]/g, "")} · ${Math.ceil(a.size / 1024)} KB</li>`).join("");
        if (m.confirmed_at) { $("#form").hidden = true; show(`Recibo confirmado el ${m.confirmed_at} (UTC).`); }
      } catch (e) { show(e.message, true); }
    })();
    $("#form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { const r = await api("POST", "/confirm", { name: e.target.name.value }); $("#form").hidden = true; show(`Gracias. Recibo confirmado el ${r.confirmed_at} (UTC).`); }
      catch (ex) { show(ex.message, true); }
    });
  </script>
</body>
</html>
